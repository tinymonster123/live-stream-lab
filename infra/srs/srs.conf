listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # For LAN playback set SRS_CANDIDATE to the Mac's LAN IP before starting Compose.
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS for clients without HTTP-FLV (notably Safari). Segments are written
    # under the embedded HTTP server root and served at /[app]/[stream].m3u8.
    # hls_cleanup drops expired segments while live; hls_dispose removes the
    # stream's files 60s after it unpublishes.
    hls {
        enabled       on;
        hls_path      ./objs/nginx/html;
        hls_m3u8_file [app]/[stream].m3u8;
        hls_ts_file   [app]/[stream]-[seq].ts;
        hls_fragment  2;
        hls_window    10;
        hls_cleanup   on;
        hls_dispose   60;
    }
}
